    <script>
        function removeUnderBannerNav() {
            const root = document.getElementById('dynamic-content');
            if (!root) return;

            const wanted = new Set(['about', 'call for papers', 'venue', 'contact']);
            const navs = Array.from(root.querySelectorAll('nav'));

            for (const nav of navs) {
                const labels = Array.from(nav.querySelectorAll('a'))
                    .map(a => (a.textContent || '').trim().toLowerCase())
                    .filter(Boolean);

                const hits = labels.filter(t => wanted.has(t)).length;

                if (hits >= 3) {
                    const wrapper = nav.closest('div') || nav;
                    wrapper.remove();
                    return;
                }
            }
        }

        const logoSrc = 'logo.jpg';
        const img = new Image();
        let sourceImageObj = null;

        const sidebarCanvas = document.getElementById('logoCanvas');
        const sidebarCtx = sidebarCanvas.getContext('2d');

        const bannerCanvas = document.getElementById('bannerCanvas');
        const bannerCtx = bannerCanvas.getContext('2d');

        const sidebarSettings = {
            startSpatial: 0.5,
            endSpatial: 18,
            amplitude: 55,
            sweepDuration: 6.0,
            pWidth: 1,
            pHeight: 1,
            resolution: 1,
            morphSpeed: 0.005,
            holdTime: 9.5,
            speed: 0.009
        };

        const oceanSettings = {
            swellAmp: 41,
            swellFreq: 2,
            swellSpeed: 0.15,
            chopAmp: 20,
            chopFreq: 8,
            chopSpeed: 0.08,
            waveDuration: 3.0,
            morphSpeed: 0.004,
            resolution: 1,
            holdTime: 1.0
        };

        let sidebarParticles = [];
        let sbWidth, sbHeight, sbIsAnimating = false, sbGlobalTime = 0, sbStateTime = 0, sbLoopState = 'sweep_in', sbMorphProgress = 0, sbAnimId;

        let bannerParticles = [];
        let bnWidth, bnHeight, bnIsAnimating = false, bnGlobalTime = 0, bnStateTime = 0, bnStage = 'wave', bnMorphProgress = 0, bnAnimId;

        img.onload = () => {
            sourceImageObj = img;
            initSidebarAnimation(img);

            if (window.matchMedia('(min-width: 768px)').matches) {
                initBannerWhenReady(img);
            }
        };
        img.src = logoSrc;

        function drawStaticSidebarLogo() {
            if (!sidebarCtx || sidebarParticles.length === 0) return;
            sidebarCtx.clearRect(0, 0, sbWidth, sbHeight);
            sidebarCtx.fillStyle = 'black';
            sidebarParticles.forEach(p => sidebarCtx.fillRect(p.x, p.y, sidebarSettings.pWidth, sidebarSettings.pHeight));
        }

        function initSidebarAnimation(image) {
            if (!sidebarCanvas || !sidebarCtx || !sidebarCanvas.parentElement) return;

            sbWidth = sidebarCanvas.parentElement.offsetWidth;
            sbHeight = sidebarCanvas.parentElement.offsetHeight;

            const dpr = window.devicePixelRatio || 1;
            sidebarCanvas.width = sbWidth * dpr;
            sidebarCanvas.height = sbHeight * dpr;

            sidebarCtx.setTransform(1, 0, 0, 1, 0, 0);
            sidebarCtx.scale(dpr, dpr);

            const scale = Math.min(sbWidth / image.width, sbHeight / image.height) * 0.85;
            const drawW = image.width * scale;
            const drawH = image.height * scale;
            const offX = (sbWidth - drawW) / 2;
            const offY = (sbHeight - drawH) / 2 + 20;

            sidebarCtx.clearRect(0, 0, sbWidth, sbHeight);
            sidebarCtx.drawImage(image, offX, offY, drawW, drawH);

            const data = sidebarCtx.getImageData(0, 0, sbWidth * dpr, sbHeight * dpr).data;
            sidebarParticles = [];

            const step = Math.max(1, Math.floor(sidebarSettings.resolution * dpr));

            for (let y = 0; y < sbHeight * dpr; y += step) {
                for (let x = 0; x < sbWidth * dpr; x += step) {
                    const i = (y * (sbWidth * dpr) + x) * 4;
                    if (data[i + 3] > 128 && (data[i] + data[i + 1] + data[i + 2]) / 3 < 200) {
                        sidebarParticles.push({
                            x: x / dpr,
                            y: y / dpr,
                            normX: x / (sbWidth * dpr)
                        });
                    }
                }
            }

            sidebarCtx.clearRect(0, 0, sbWidth, sbHeight);
            drawStaticSidebarLogo();
        }

        function startSidebarLoop() {
            sbStateTime = 0;
            sbGlobalTime = 0;
            sbMorphProgress = 0;
            sbLoopState = 'sweep_in';
            sbIsAnimating = true;
            if (sbAnimId) cancelAnimationFrame(sbAnimId);
            sidebarLoop();
        }

        function sidebarLoop() {
            if (!sbIsAnimating) {
                drawStaticSidebarLogo();
                return;
            }

            sbGlobalTime += sidebarSettings.speed;
            sbStateTime += 1 / 60;

            let currentFreq = sidebarSettings.startSpatial;
            let currentMorph = sbMorphProgress;

            if (sbLoopState === 'sweep_in') {
                const p = Math.min(sbStateTime / sidebarSettings.sweepDuration, 1.0);
                currentFreq = sidebarSettings.startSpatial + (sidebarSettings.endSpatial - sidebarSettings.startSpatial) * p;
                if (sbStateTime >= sidebarSettings.sweepDuration) {
                    sbLoopState = 'forming';
                    sbStateTime = 0;
                }
            } else if (sbLoopState === 'forming') {
                sbMorphProgress += sidebarSettings.morphSpeed;
                currentMorph = sbMorphProgress;
                if (sbMorphProgress >= 1) {
                    sbLoopState = 'holding';
                    sbStateTime = 0;
                }
            } else if (sbLoopState === 'holding') {
                if (sbStateTime >= sidebarSettings.holdTime) {
                    sbLoopState = 'dissolving';
                    sbStateTime = 0;
                }
            } else if (sbLoopState === 'dissolving') {
                sbMorphProgress -= sidebarSettings.morphSpeed;
                currentMorph = sbMorphProgress;
                if (sbMorphProgress <= 0) {
                    sbLoopState = 'sweep_out';
                    sbStateTime = 0;
                }
            } else if (sbLoopState === 'sweep_out') {
                const p = Math.min(sbStateTime / sidebarSettings.sweepDuration, 1.0);
                currentFreq = sidebarSettings.endSpatial - (sidebarSettings.endSpatial - sidebarSettings.startSpatial) * p;
                if (sbStateTime >= sidebarSettings.sweepDuration) {
                    sbLoopState = 'sweep_in';
                    sbStateTime = 0;
                }
            }

            sidebarCtx.clearRect(0, 0, sbWidth, sbHeight);
            sidebarCtx.fillStyle = 'black';

            for (let i = 0; i < sidebarParticles.length; i++) {
                const p = sidebarParticles[i];
                const waveY = (sbHeight / 2) + Math.sin((p.normX * currentFreq * Math.PI * 2) + sbGlobalTime) * sidebarSettings.amplitude;
                const ease = currentMorph < 0.5
                    ? 4 * currentMorph * currentMorph * currentMorph
                    : (currentMorph - 1) * (2 * currentMorph - 2) * (2 * currentMorph - 2) + 1;
                const renderY = waveY + (p.y - waveY) * ease;
                sidebarCtx.fillRect(p.x, renderY, sidebarSettings.pWidth, sidebarSettings.pHeight);
            }

            sbAnimId = requestAnimationFrame(sidebarLoop);
        }

        function initBannerWhenReady(image) {
            const desktopBannerImage = document.getElementById('desktop-banner-image');
            if (!desktopBannerImage) return;

            const run = () => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        initBannerAnimation(image);
                    });
                });
            };

            if (desktopBannerImage.complete && desktopBannerImage.naturalWidth > 0) {
                run();
            } else {
                desktopBannerImage.onload = run;
            }
        }

        function initBannerAnimation(image) {
            const container = document.getElementById('main-banner-container');
            const desktopWrap = container ? container.querySelector('.banner-desktop-wrap') : null;
            const imgElement = document.getElementById('desktop-banner-image');

            if (!container || !desktopWrap || !bannerCanvas || !bannerCtx || !imgElement) {
                console.log('Banner init aborted:', { container, desktopWrap, bannerCanvas, bannerCtx, imgElement });
                return;
            }

            bnWidth = desktopWrap.offsetWidth || container.offsetWidth;
            bnHeight = imgElement.clientHeight || imgElement.offsetHeight || 224;

            const dpr = window.devicePixelRatio || 1;

            bannerCanvas.width = bnWidth * dpr;
            bannerCanvas.height = bnHeight * dpr;

            bannerCtx.setTransform(1, 0, 0, 1, 0, 0);
            bannerCtx.scale(dpr, dpr);

            const scale = Math.min(bnWidth / image.width, bnHeight / image.height) * 0.85;
            const drawW = image.width * scale;
            const drawH = image.height * scale;
            const dx = (bnWidth - drawW) / 2;
            const dy = (bnHeight - drawH) / 2;

            bannerCtx.clearRect(0, 0, bnWidth, bnHeight);
            bannerCtx.drawImage(image, dx, dy, drawW, drawH);

            const data = bannerCtx.getImageData(0, 0, bnWidth * dpr, bnHeight * dpr).data;
            bannerParticles = [];

            const step = Math.max(1, Math.floor(oceanSettings.resolution * dpr));

            for (let y = 0; y < bnHeight * dpr; y += step) {
                for (let x = 0; x < bnWidth * dpr; x += step) {
                    const i = (y * (bnWidth * dpr) + x) * 4;
                    if (data[i + 3] > 128 && (data[i] + data[i + 1] + data[i + 2]) / 3 < 200) {
                        bannerParticles.push({
                            tx: x / dpr,
                            ty: y / dpr,
                            sx: Math.random() * bnWidth,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                }
            }

            bannerCtx.clearRect(0, 0, bnWidth, bnHeight);
            console.log('Banner init ok:', { bnWidth, bnHeight, particles: bannerParticles.length });
            startBannerLoop();
        }

        function startBannerLoop() {
            bnStage = 'wave';
            bnStateTime = 0;
            bnGlobalTime = 0;
            bnMorphProgress = 0;
            bnIsAnimating = true;
            if (bnAnimId) cancelAnimationFrame(bnAnimId);
            bannerLoop();
        }

        function stopBannerLoop() {
            bnIsAnimating = false;
            if (bnAnimId) cancelAnimationFrame(bnAnimId);
        }

        function bannerLoop() {
            if (!bnIsAnimating) return;

            bnGlobalTime += 1 / 60;
            bnStateTime += 1 / 60;

            if (bnStage === 'wave' && bnStateTime > oceanSettings.waveDuration) {
                bnStage = 'morph';
            } else if (bnStage === 'morph') {
                bnMorphProgress += oceanSettings.morphSpeed;
                if (bnMorphProgress >= 1) bnStage = 'hold';
            } else if (bnStage === 'hold' && bnStateTime > oceanSettings.holdTime) {
                bnStage = 'dissolve';
            } else if (bnStage === 'dissolve') {
                bnMorphProgress -= oceanSettings.morphSpeed;
                if (bnMorphProgress <= 0) {
                    bnMorphProgress = 0;
                    bnStage = 'wave';
                    bnStateTime = 0;
                }
            }

            bannerCtx.clearRect(0, 0, bnWidth, bnHeight);
            bannerCtx.fillStyle = '#ffffff';

            for (let i = 0; i < bannerParticles.length; i++) {
                const p = bannerParticles[i];
                const t = bnMorphProgress;
                const ease = t < 0.5
                    ? 4 * t * t * t
                    : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;

                const currentX = p.sx + (p.tx - p.sx) * ease;
                const normX = currentX / bnWidth;

                const waveY =
                    (bnHeight / 2) +
                    Math.sin(normX * oceanSettings.swellFreq * Math.PI + bnGlobalTime * oceanSettings.swellSpeed) * oceanSettings.swellAmp +
                    Math.cos(normX * oceanSettings.chopFreq * Math.PI - bnGlobalTime * oceanSettings.chopSpeed) * oceanSettings.chopAmp;

                const currentY = waveY + (p.ty - waveY) * ease;
                bannerCtx.fillRect(currentX, currentY, 1.5, 1.5);
            }

            bnAnimId = requestAnimationFrame(bannerLoop);
        }

        async function handleNavigation(targetId) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.querySelectorAll(`.nav-link[data-target="${targetId}"]`).forEach(l => l.classList.add('active'));

            try {
                const response = await fetch(`sections/${targetId}.html`);
                if (response.ok) {
                    document.getElementById('dynamic-content').innerHTML = await response.text();
                    removeUnderBannerNav();

                    if (targetId === 'news') {
                        await loadNewsPosts();
                    }

                    if (targetId === 'program') {
                        await loadProgramme();
                    }
                }
            } catch (err) {
                console.error("Navigation Error:", err);
            }

            const logoArea = document.getElementById('sidebar-logo-area');
            const banner = document.getElementById('main-banner-container');

            if (targetId === 'about' || targetId === 'news') {
                banner.classList.remove('hidden');
                logoArea.classList.add('opacity-0');
                sbIsAnimating = false;

                if (sourceImageObj && window.matchMedia('(min-width: 768px)').matches) {
                    initBannerWhenReady(sourceImageObj);
                }
            } else {
                banner.classList.add('hidden');
                logoArea.classList.remove('opacity-0');
                logoArea.classList.add('opacity-100');

                stopBannerLoop();
                startSidebarLoop();
            }

            document.getElementById('content-area').scrollTop = 0;
        }

        async function loadNewsPosts() {
            const container = document.getElementById('news-container');
            if (!container) return;

            const posts = [
                '2026-09-13-apple-platinum-sponsor.html',
                '2026-07-18-ecosoc-patronage.html',
                '2026-02-keynote-speakers.html',
                '2026-01-27-warwick-venice-centre.html',
                '2025-12-23-fondazione-levi.html',
                'archive-links.html'
            ];

            container.innerHTML = '';

            for (const file of posts) {
                const res = await fetch(`news-posts/${file}`);
                if (res.ok) {
                    const div = document.createElement('div');
                    div.className = "mb-16 block clear-both";
                    div.innerHTML = await res.text();
                    container.appendChild(div);
                }
            }

            removeUnderBannerNav();
        }

        async function loadProgramme() {
            const container = document.getElementById('programme-container');
            if (!container) return;

            let data;
            try {
                const res = await fetch('/program.json');
                if (!res.ok) throw new Error('bad response');
                data = await res.json();
            } catch (err) {
                console.error('Programme load error:', err);
                container.innerHTML = '<p class="text-gray-400 text-sm font-light">The programme could not be loaded right now. Please try again later.</p>';
                return;
            }

            // Programme is still being finalized: show only the general day-by-day
            // skeleton (times, codes, room, session type) with no titles, names,
            // chairs, authors, descriptions or links. Flip to true once the
            // programme is finalized to restore the full detailed view.
            const SHOW_FULL_DETAILS = false;

            const typeLabel = {
                session: 'Session',
                keynote: 'Keynote',
                poster: 'Poster',
                demo: 'Demo',
                social: 'Social Event'
            };

            const el = (tag, opts = {}) => {
                const e = document.createElement(tag);
                if (opts.className) e.className = opts.className;
                if (opts.text !== undefined) e.textContent = opts.text;
                if (opts.href !== undefined) { e.href = opts.href; e.target = '_blank'; e.rel = 'noopener'; }
                return e;
            };

            const fmtTime = (s, en) => (s && en) ? `${s}–${en}` : (s || '');

            // Set as inline styles rather than Tailwind border-{color} utility classes:
            // the CDN build's generated rule order isn't guaranteed, so a directional
            // class like border-l-venice-red can lose the cascade to the plain
            // border-gray-100 utility also present on the card.
            const accentByType = {
                session: '#005f73',
                keynote: '#005f73',
                poster: '#4da8b8',
                demo: '#4da8b8',
                social: '#A52A2A'
            };

            const titleColorByType = {
                social: 'text-venice-red'
            };

            function linkLabel(url) {
                if (/maps\.(google|app\.goo)|google\.[a-z.]+\/maps/.test(url)) return 'View on map';
                return 'More information';
            }

            function renderTalk(talk) {
                const row = el('div', { className: 'flex flex-col sm:flex-row sm:items-baseline gap-0.5 sm:gap-3 py-2 border-t border-gray-100 first:border-t-0' });

                const meta = el('div', { className: 'flex gap-3 shrink-0 sm:w-28' });
                if (talk.time) meta.appendChild(el('span', { className: 'text-xs text-gray-400 font-light', text: talk.time }));
                meta.appendChild(el('span', { className: 'text-xs text-gray-400 font-light', text: '#' + talk.number }));
                row.appendChild(meta);

                const body = el('div', { className: 'min-w-0' });
                body.appendChild(el('div', { className: 'text-sm text-gray-800 font-normal', text: talk.title }));

                const authorsLine = el('div', { className: 'text-xs text-gray-500 font-light mt-0.5' });
                (talk.authors || []).forEach((name, i) => {
                    if (i > 0) authorsLine.appendChild(document.createTextNode(', '));
                    // Split off a trailing " (R)" (remote-presenter marker) so it renders
                    // outside the underline, and so presenter-matching (which never
                    // carries that suffix) still works.
                    const remoteMatch = name.match(/^(.*) \(R\)$/);
                    const baseName = remoteMatch ? remoteMatch[1] : name;
                    const isPresenter = talk.presenter && baseName === talk.presenter;
                    authorsLine.appendChild(el(isPresenter ? 'u' : 'span', { text: baseName }));
                    if (remoteMatch) authorsLine.appendChild(document.createTextNode(' (R)'));
                });
                body.appendChild(authorsLine);
                row.appendChild(body);
                return row;
            }

            function renderItem(item) {
                if (item.type === 'break') {
                    const row = el('div', { className: 'w-full flex justify-between items-center bg-lagoon-bg text-gray-500 text-xs font-light px-4 py-2 rounded my-2' });
                    row.appendChild(el('span', { text: item.title }));
                    row.appendChild(el('span', { className: 'shrink-0 ml-3', text: fmtTime(item.start, item.end) }));
                    return row;
                }

                const accent = accentByType[item.type] || accentByType.session;
                const titleColor = titleColorByType[item.type] || 'text-gray-800';

                if (!SHOW_FULL_DETAILS) {
                    // Compact horizontal block: a quick day-at-a-glance overview,
                    // not the full session detail.
                    const block = el('div', { className: 'bg-white border border-gray-100 shadow-sm rounded-lg p-3 border-l-4 w-36 sm:w-40' });
                    block.style.borderLeftColor = accent;

                    block.appendChild(el('div', { className: 'text-xs uppercase tracking-widest text-gray-400 font-medium', text: fmtTime(item.start, item.end) }));

                    const tags = el('div', { className: 'flex flex-wrap gap-1 mt-1' });
                    if (item.code) {
                        tags.appendChild(el('span', { className: 'inline-block text-[10px] font-semibold uppercase tracking-widest border border-lagoon-blue text-lagoon-blue rounded px-1.5 py-0.5', text: item.code }));
                    }
                    if (item.parallel) {
                        tags.appendChild(el('span', { className: 'inline-block text-[10px] uppercase tracking-widest bg-gray-100 text-gray-500 rounded-full px-1.5 py-0.5', text: 'Parallel' }));
                    }
                    if (tags.childNodes.length) block.appendChild(tags);

                    block.appendChild(el('div', { className: `text-sm font-medium mt-1 ${titleColor}`, text: typeLabel[item.type] || 'Session' }));
                    if (item.room) {
                        block.appendChild(el('div', { className: 'text-xs text-gray-500 font-light mt-1', text: item.room }));
                    }
                    return block;
                }

                const card = el('div', { className: 'bg-white border border-gray-100 shadow-sm rounded-lg p-5 mb-4 border-l-4' });
                card.style.borderLeftColor = accent;

                const headLine = el('div', { className: 'flex flex-wrap items-center gap-2' });
                headLine.appendChild(el('span', { className: 'text-xs uppercase tracking-widest text-gray-400 font-medium', text: fmtTime(item.start, item.end) }));
                if (item.code) {
                    headLine.appendChild(el('span', { className: 'inline-block text-[10px] font-semibold uppercase tracking-widest border border-lagoon-blue text-lagoon-blue rounded px-2 py-0.5', text: item.code }));
                }
                if (item.parallel) {
                    headLine.appendChild(el('span', { className: 'inline-block text-[10px] uppercase tracking-widest bg-gray-100 text-gray-500 rounded-full px-2 py-0.5', text: 'Parallel' }));
                }
                card.appendChild(headLine);

                card.appendChild(el('div', { className: `text-lg font-normal mt-1 ${titleColor}`, text: item.title }));

                if (item.type === 'keynote' && item.keynote_title) {
                    card.appendChild(el('div', { className: 'text-base font-light italic text-lagoon-blue mt-1', text: '“' + item.keynote_title + '”' }));
                }

                const metaBits = [];
                if (item.room) metaBits.push('Room: ' + item.room);
                if (item.chairs && item.chairs.length) {
                    metaBits.push((item.chairs.length > 1 ? 'Chairs: ' : 'Chair: ') + item.chairs.join(', '));
                }
                if (metaBits.length) {
                    card.appendChild(el('div', { className: 'text-sm text-gray-500 font-light mt-1', text: metaBits.join('  ·  ') }));
                }

                if (item.description && item.description.length) {
                    const desc = el('div', { className: 'mt-3 space-y-1' });
                    item.description.forEach(line => desc.appendChild(el('p', { className: 'text-sm text-gray-600 font-light leading-relaxed', text: line })));
                    card.appendChild(desc);
                }

                if (item.links && item.links.length) {
                    const links = el('div', { className: 'mt-2 space-y-1' });
                    item.links.forEach(url => {
                        links.appendChild(el('a', { href: url, className: 'block text-sm text-lagoon-light hover:underline font-light', text: linkLabel(url) + ' ↗' }));
                    });
                    card.appendChild(links);
                }

                if (item.talks && item.talks.length) {
                    const talksWrap = el('div', { className: 'mt-4 border-t border-gray-100 pt-1' });
                    item.talks.forEach(t => talksWrap.appendChild(renderTalk(t)));
                    card.appendChild(talksWrap);
                }

                return card;
            }

            container.innerHTML = '';

            if (data.days && data.days.length) {
                const nav = el('div', { className: 'flex gap-2 overflow-x-auto whitespace-nowrap pb-2 mb-6 text-xs uppercase tracking-[0.15em] font-medium text-gray-600' });
                data.days.forEach((day, i) => {
                    const a = el('a', { className: 'shrink-0 px-3 py-1.5 border border-gray-300 rounded hover:bg-gray-50', text: day.label });
                    a.href = '#prog-day-' + i;
                    nav.appendChild(a);
                });
                container.appendChild(nav);
            }

            (data.days || []).forEach((day, i) => {
                const dayWrap = el('div', { className: 'mb-10' });
                dayWrap.id = 'prog-day-' + i;
                dayWrap.style.scrollMarginTop = '20px';
                dayWrap.appendChild(el('h4', { className: 'text-xl font-light text-lagoon-blue border-b border-gray-200 pb-2 mb-4', text: day.label }));

                if (SHOW_FULL_DETAILS) {
                    (day.sessions || []).forEach(item => dayWrap.appendChild(renderItem(item)));
                } else {
                    const row = el('div', { className: 'flex flex-wrap items-stretch gap-3' });
                    (day.sessions || []).forEach(item => row.appendChild(renderItem(item)));
                    dayWrap.appendChild(row);
                }

                container.appendChild(dayWrap);
            });

            if (data.rooms && data.rooms.length) {
                const roomsWrap = el('div', { className: 'mt-12' });
                roomsWrap.appendChild(el('h4', { className: 'text-xl font-light text-lagoon-blue border-b border-gray-200 pb-2 mb-4', text: 'Rooms & Locations' }));
                const list = el('div', { className: 'bg-white border border-gray-100 shadow-sm rounded-lg divide-y divide-gray-100' });
                data.rooms.forEach(r => {
                    const row = el('div', { className: 'flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 px-5 py-3' });
                    const left = el('div', {});
                    left.appendChild(el('div', { className: 'text-sm font-normal text-gray-800', text: r.name }));
                    if (r.location) left.appendChild(el('div', { className: 'text-xs text-gray-500 font-light mt-0.5', text: r.location }));
                    row.appendChild(left);
                    if (r.map) row.appendChild(el('a', { href: r.map, className: 'text-sm text-lagoon-light hover:underline font-light shrink-0', text: 'View on map ↗' }));
                    list.appendChild(row);
                });
                roomsWrap.appendChild(list);
                container.appendChild(roomsWrap);
            }

            removeUnderBannerNav();
        }

        document.getElementById('menu-button').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        document.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', (e) => {
            document.getElementById('mobile-menu').classList.add('hidden');
            handleNavigation(e.currentTarget.getAttribute('data-target'));
        }));

        window.addEventListener('resize', () => {
            if (!sourceImageObj) return;

            initSidebarAnimation(sourceImageObj);

            if (window.matchMedia('(min-width: 768px)').matches) {
                initBannerWhenReady(sourceImageObj);
            } else {
                stopBannerLoop();
            }
        });
        
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const validSections = ['about', 'venue', 'program', 'call-for-papers', 'registration', 'sponsors', 'patronage', 'contact', 'news', 'sponsorship-info'];
            
            let section = params.get('section') || 'about';
            if (!validSections.includes(section)) section = 'about';

            setTimeout(async () => {
                await handleNavigation(section);
                removeUnderBannerNav();

                const hash = window.location.hash;
                if (hash) {
                    const targetElement = document.querySelector(hash);
                    if (targetElement) targetElement.scrollIntoView({ behavior: 'smooth' });
                }
            }, 300);
        });
    </script>
</body>
</html>
