<body>

            <div class="flex justify-center space-x-5 mt-5 mb-2">

    <div class="p-0 py-6 flex-grow">

            <a data-target="call-for-papers" class="nav-link text-xs uppercase tracking-[0.15em] font-medium text-gray-500">Call for papers</a>

<header class="md:hidden bg-white shadow-sm fixed w-full z-30 border-b border-gray-100">

<div id="mobile-menu" class="hidden fixed inset-0 z-40 bg-white overflow-y-auto p-8 pt-24">
    <h2 class="text-3xl font-light text-lagoon-blue mb-8 tracking-widest">MENU</h2>
    <nav class="space-y-4">
        <a data-target="about" class="nav-link block text-sm uppercase tracking-[0.15em] font-medium text-gray-600">About</a>
        <a data-target="venue" class="nav-link block text-sm uppercase tracking-[0.15em] font-medium text-gray-600">Conference venue</a>
        <a data-target="program" class="nav-link block text-sm uppercase tracking-[0.15em] font-medium text-gray-600">Programme</a>
        <a data-target="call-for-papers" class="nav-link block text-sm uppercase tracking-[0.15em] font-medium text-gray-600">Call for papers</a>
        <a data-target="registration" class="nav-link block text-sm uppercase tracking-[0.15em] font-medium text-gray-600">Registration</a>
        <a data-target="sponsors" class="nav-link block text-sm uppercase tracking-[0.15em] font-medium text-gray-600">Sponsors</a>

<main id="content-area" class="flex-grow overflow-y-auto bg-gray-50 md:mt-0 mt-24 scroll-smooth">
    <section id="main-banner-container" class="w-full">
        <canvas id="bannerCanvas"></canvas>
        <img src="blue5.jpg" alt="Banner" class="w-full h-auto block"
             onerror="this.src='https://placehold.co/1000x224/E0F2F1/005F73?text=I3DA+Banner';">
    </section>
    <div id="dynamic-content"></div>
</main>

</div>

<script>
/* --- GLOBAL INITIALIZATION --- */
const logoSrc = 'logo.jpg';
const img = new Image();
let sourceImageObj = null;

img.onload = () => {
    sourceImageObj = img;
    initSidebarAnimation(img);
    initBannerAnimation(img);
};
img.src = logoSrc;

/* --- SIDEBAR ANIMATION --- */
const sidebarCanvas = document.getElementById('logoCanvas');
const sidebarCtx = sidebarCanvas.getContext('2d');

const sidebarSettings = {
    startSpatial: 0.5,
    endSpatial: 18,
    amplitude: 55,
    sweepDuration: 6.0,
    pWidth: 1,
    pHeight: 1,
    resolution: 1,
    morphSpeed: 0.005,
    holdTime: 9.5,
    speed: 0.009
};

let sidebarParticles = [],
    sbWidth,
    sbHeight,
    sbIsAnimating = false,
    sbGlobalTime = 0,
    sbStateTime = 0,
    sbLoopState = 'sweep_in',
    sbMorphProgress = 0,
    sbAnimId,
    sbHasStarted = false;   // 🔑 KEY FIX

function drawStaticSidebarLogo() {
    if (!sidebarCtx || sidebarParticles.length === 0) return;
    sidebarCtx.clearRect(0, 0, sbWidth, sbHeight);
    sidebarCtx.fillStyle = 'black';
    sidebarParticles.forEach(p =>
        sidebarCtx.fillRect(p.x, p.y, sidebarSettings.pWidth, sidebarSettings.pHeight)
    );
}

function initSidebarAnimation(image) {
    sbWidth = sidebarCanvas.parentElement.offsetWidth;
    sbHeight = sidebarCanvas.parentElement.offsetHeight;
    const dpr = window.devicePixelRatio || 1;
    sidebarCanvas.width = sbWidth * dpr;
    sidebarCanvas.height = sbHeight * dpr;
    sidebarCtx.scale(dpr, dpr);

    const scale = Math.min(sbWidth / image.width, sbHeight / image.height) * 0.85;
    const drawW = image.width * scale,
          drawH = image.height * scale;
    const offX = (sbWidth - drawW) / 2,
          offY = (sbHeight - drawH) / 2 + 20;

    sidebarCtx.drawImage(image, offX, offY, drawW, drawH);
    const data = sidebarCtx.getImageData(0, 0, sbWidth * dpr, sbHeight * dpr).data;

    sidebarParticles = [];
    const step = Math.max(1, Math.floor(sidebarSettings.resolution * dpr));

    for (let y = 0; y < sbHeight * dpr; y += step) {
        for (let x = 0; x < sbWidth * dpr; x += step) {
            const i = (y * (sbWidth * dpr) + x) * 4;
            if (data[i + 3] > 128 &&
                (data[i] + data[i + 1] + data[i + 2]) / 3 < 200) {
                sidebarParticles.push({
                    x: x / dpr,
                    y: y / dpr,
                    normX: x / (sbWidth * dpr)
                });
            }
        }
    }

    sidebarCtx.clearRect(0, 0, sbWidth, sbHeight);
    drawStaticSidebarLogo();
}

function startSidebarLoop() {
    if (sbHasStarted) return;   // <-- DON'T RESTART
    sbHasStarted = true;

    sbStateTime = 0;
    sbGlobalTime = 0;
    sbMorphProgress = 0;
    sbLoopState = 'sweep_in';
    sbIsAnimating = true;

    if (sbAnimId) cancelAnimationFrame(sbAnimId);
    sidebarLoop();
}

function sidebarLoop() {
    if (!sbIsAnimating) {
        drawStaticSidebarLogo();
        return;
    }

    sbGlobalTime += sidebarSettings.speed;
    sbStateTime += 1 / 60;

    sidebarCtx.clearRect(0, 0, sbWidth, sbHeight);
    sidebarCtx.fillStyle = 'black';

    for (let i = 0; i < sidebarParticles.length; i++) {
        const p = sidebarParticles[i];
        const waveY = (sbHeight / 2) +
            Math.sin((p.normX * 18 * Math.PI * 2) + sbGlobalTime)
            * sidebarSettings.amplitude;

        sidebarCtx.fillRect(
            p.x,
            waveY,
            sidebarSettings.pWidth,
            sidebarSettings.pHeight
        );
    }

    sbAnimId = requestAnimationFrame(sidebarLoop);
}

/* --- NAVIGATION (THIS IS THE KEY CHANGE) --- */
async function handleNavigation(targetId) {

    document.querySelectorAll('.nav-link').forEach(l =>
        l.classList.remove('active'));

    document.querySelectorAll(`.nav-link[data-target="${targetId}"]`)
        .forEach(l => l.classList.add('active'));

    try {
        const response = await fetch(`sections/${targetId}.html`);
        if (response.ok) {
            document.getElementById('dynamic-content').innerHTML =
                await response.text();
        }
    } catch (err) {
        console.error("Navigation Error:", err);
    }

    const logoArea = document.getElementById('sidebar-logo-area');
    const banner = document.getElementById('main-banner-container');

    if (targetId === 'about' || targetId === 'news') {
        banner.classList.remove('hidden');
        logoArea.classList.add('opacity-0');
        sbIsAnimating = false;   // PAUSE (do not reset)
    } else {
        banner.classList.add('hidden');
        logoArea.classList.remove('opacity-0');
        logoArea.classList.add('opacity-100');

        if (!sbHasStarted) {
            startSidebarLoop();   // FIRST TIME ONLY
        } else {
            sbIsAnimating = true; // RESUME (no restart)
        }
    }

    document.getElementById('content-area').scrollTop = 0;
}

/* --- LOAD ON START --- */
window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    let section = params.get('section') || 'about';
    handleNavigation(section);
});
</script>
