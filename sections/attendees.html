        <button type="submit"
                class="bg-lagoon-blue text-white px-6 py-3 text-xs uppercase tracking-[0.15em] font-medium hover:bg-lagoon-light transition-colors">

      <p id="attendees-error" class="hidden mt-4 text-sm text-red-700" role="alert">
        That password is not correct. Please try again.
